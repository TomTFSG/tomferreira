    <script src="../js/logos.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const popUp = document.querySelector(".popUp");
            const closeBtn = popUp.querySelector(".close");
            const leftBtn = popUp.querySelector(".left");
            const rightBtn = popUp.querySelector(".right");
            const imgCount = popUp.querySelector(".imgCount");
            const contentContainer = popUp.querySelector(".popUp-content");
            const textContainer = popUp.querySelector(".popUp-text p");

            const works = {
                "work-01": {
                    files: [
                        "../img/work/game/work_1/0.png",
                        "../img/work/game/work_1/1.png",
                        "../img/work/game/work_1/2.png",
                        "../img/work/game/work_1/3.png"
                    ],
                    text: "A prototype for a rogue-like game developed in Unity using C# that explores the idea of legacy through generations, and procedural level generation."
                },
                "work-02": {
                    files: [
                        "../img/work/game/work_2/0.jpg",
                        "../img/work/game/work_2/1.jpg",
                        "../img/work/game/work_2/2.jpg",
                        "../img/work/game/work_2/3.jpg",
                        "../img/work/game/work_2/4.jpg",
                        "../img/work/game/work_2/5.jpg",
                        "../img/work/game/work_2/6.jpg",
                        "../img/work/game/work_2/7.jpg",
                        "../img/work/game/work_2/8.jpg",
                        "../img/work/game/work_2/9.jpg",
                        "../img/work/game/work_2/10.jpg",
                        "../img/work/game/work_2/11.jpg",
                        "../img/work/game/work_2/12.jpg",
                        "../img/work/game/work_2/13.jpg",
                        "../img/work/game/work_2/14.jpg",
                        "../img/work/game/work_2/15.jpg",
                        "../img/work/game/work_2/16.jpg",
                        "../img/work/game/work_2/17.jpg",
                        "../img/work/game/work_2/18.jpg",
                        "../img/work/game/work_2/19.jpg",
                        "../img/work/game/work_2/20.jpg",
                        "../img/work/game/work_2/21.jpg",
                        "../img/work/game/work_2/22.jpg",
                        "../img/work/game/work_2/23.jpg",
                        "../img/work/game/work_2/24.jpg",
                        "../img/work/game/work_2/25.jpg",
                        "../img/work/game/work_2/26.jpg",
                        "../img/work/game/work_2/27.jpg",
                        "../img/work/game/work_2/28.jpg",
                        "../img/work/game/work_2/29.jpg",
                        "../img/work/game/work_2/30.jpg",
                        "../img/work/game/work_2/31.jpg",
                        "../img/work/game/work_2/32.jpg",
                        "../img/work/game/work_2/33.jpg",
                        "../img/work/game/work_2/34.jpg",
                        "../img/work/game/work_2/35.jpg"
                    ],
                    text: "A dungeon created in Rhino with simple enemies as a way to test level design, 3D modeling and lighting"
                },
                "work-03": {
                    files: [
                        "../img/work/game/work_3/0.png",
                        "../img/work/game/work_3/1.png",
                        "../img/work/game/work_3/2.png",
                        "../img/work/game/work_3/3.png",
                        "../img/work/game/work_3/4.png",
                        "../img/work/game/work_3/5.png"
                    ],
                    text: "A group project for an Interactive Design class. We developed a web-based augmented reality game where the player explores their city to find clues that help them accuse a criminal and solve a crime."
                },
                "work-04": {
                    files: [
                        "../img/work/game/work_4/0.png",
                        "../img/work/game/work_4/1.png",
                        "../img/work/game/work_4/2.png",
                        "../img/work/game/work_4/3.png",
                        "../img/work/game/work_4/4.png"
                    ],
                    text: "A group project for an Interactive Media Design class with the goal of creating a game prototype where the player explores different insect species in their area."
                },
                "work-05": {
                    files: [
                        "../img/work/game/work_5/0.png",
                        "../img/work/game/work_5/1.png",
                        "../img/work/game/work_5/2.png",
                        "../img/work/game/work_5/3.png",
                        "../img/work/game/work_5/4.png"
                    ],
                    text: "Generation of a 3D city in Processing 3D with moving objects, different textures and lighting."
                },
                
            };

            let currentWork = null;
            let currentIndex = 0;

            function showMedia(index) {
                if (!currentWork) return;

                const oldMedia = contentContainer.querySelector(".imgPop, video");
                if (oldMedia) oldMedia.remove();

                const file = currentWork.files[index];
                const ext = file.split('.').pop().toLowerCase();

                let mediaEl;
                if (["mp4", "webm", "mov"].includes(ext)) {
                    mediaEl = document.createElement("video");
                    mediaEl.src = file;
                    mediaEl.classList.add("imgPop");
                    mediaEl.controls = true;
                    mediaEl.autoplay = true;
                } else {
                    mediaEl = document.createElement("img");
                    mediaEl.src = file;
                    mediaEl.classList.add("imgPop");
                }

                contentContainer.insertBefore(mediaEl, popUp.querySelector(".popUp-text"));

                textContainer.textContent = currentWork.text;
                imgCount.textContent = `${index + 1}/${currentWork.files.length}`;
            }

            function openPopup(workKey) {
                const workData = works[workKey];
                if (!workData) return;

                currentWork = workData;
                currentIndex = 0;

                popUp.style.visibility = "visible";
                showMedia(currentIndex);
            }

            function closePopup() {
                const video = contentContainer.querySelector("video");
                if (video) {
                    video.pause();
                    video.currentTime = 0;
                }
                popUp.style.visibility = "hidden";
                currentWork = null;
            }

            // ◀️▶️ Navigation
            function next() {
                if (!currentWork) return;
                currentIndex = (currentIndex + 1) % currentWork.files.length;
                showMedia(currentIndex);
            }

            function prev() {
                if (!currentWork) return;
                currentIndex = (currentIndex - 1 + currentWork.files.length) % currentWork.files.length;
                showMedia(currentIndex);
            }

            document.querySelectorAll(".work").forEach(workEl => {
                workEl.addEventListener("click", () => {
                    openPopup(workEl.classList[1]); 
                });
            });

            closeBtn.addEventListener("click", closePopup);
            leftBtn.addEventListener("click", prev);
            rightBtn.addEventListener("click", next);
        });
        </script>
</body>
</html>
